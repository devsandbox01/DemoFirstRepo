# Workflow Name
name: First Workflow

# trigger
on: 
  push:
  # allows you to trigger the workflow manually
  workflow_dispatch: 

jobs:
  # first job
  hello-job:
    # runner - GitHub Hosted runner
    runs-on: ubuntu-latest
    steps:
      - name: Hello-World
        run: echo "Hello World"

  # second job
  echo-goodbye:
    needs: hello-job # Requires the first job to complete, so the jobs are sequenced and not parallel
    runs-on: ubuntu-latest # Fixed: Actually updated the text to 'ubuntu-latest' here
    steps:
      - name: Goodbye-World
        run: echo "Goodbye World"
      - name: Multi-line bash
        run: |
          echo "Background task 1" 
          echo "Background task 2"

  # third job
  windows-echo:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name:  Show OS
        shell: bash
        run: echo "The job is running on Windows runner"
