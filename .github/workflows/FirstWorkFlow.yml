# Workflow Name
name: First Workflow

# trigger
on: 
  push:
  # allows you to trigger the workflow manually
  workflow_dispatch: 

jobs:
  # first job
  hello-job:
    # runner - GitHub Hosted runner
    runs-on: ubuntu-latest
    steps:
      - name: Hello-World
        run: echo "Hello World" # Fixed indentation here

  # second job (Separated at the correct hierarchy level)
  echo-goodbye:
    runs-on: ubuntu-slim # Completed the runner name
    steps:
      - name: Goodbye-World
        run: echo "Goodbye World"
      - name: Multi-line bash
        run: |
        echo "Background task 1"
        echo "Background task 2"
