# Workflow Name
name: First Workflow

# trigger
on: 
  push:
  # allows you to trigger the workflow manually
  workflow_dispatch: 

jobs:
  # first job
  hello-job:
    # runner - GitHub Hosted runner
    runs-on: ubuntu-latest
    steps:
      - name: Hello-World
        run: echo "Hello World"

  # second job
  echo-goodbye:
    needs: hello-job # Requires the first job to complete, so the jobs are sequences and not parallel
    runs-on: ubuntu-slim # Fixed: Changed from 'ubuntu-slim' to a valid runner
    steps:
      - name: Goodbye-World
        run: echo "Goodbye World"
      - name: Multi-line bash
        run: |
          echo "Background task 1" # Fixed: Indented these lines by two extra spaces
          echo "Background task 2" # Fixed: Indented these lines by two extra spaces
